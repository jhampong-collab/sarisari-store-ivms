<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INTENSITY — Super Admin</title><style>body{font-family:system-ui,Arial;background:#eef4fc;color:#10254a;margin:0}header{background:linear-gradient(120deg,#071735,#1052a1);color:white;padding:24px 7%}main{max-width:950px;margin:48px auto;padding:0 20px}.panel{background:white;border:1px solid #dce5f4;border-radius:14px;padding:26px;box-shadow:0 5px 20px #10254a10}button{background:#0966cf;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}p{line-height:1.6}.muted{color:#58708f}</style></head><body><header><strong>INTENSITY</strong> · Platform Administration</header><main><div class="panel"><h1>Super Admin Dashboard</h1><p id="status">Verifying platform administrator access…</p><div id="content" hidden><p>Super Admin access verified. Store management, suspension controls, and activity monitoring will be added in the next development steps.</p><button id="signout">Sign out</button></div></div></main><script>"use strict";(async()=>{const token=sessionStorage.getItem('sari_v2_test_token');const status=document.getElementById('status');if(!token){location.replace('/');return}try{const r=await fetch('/api/v2/admin/check',{headers:{Authorization:'Bearer '+token,'X-Requested-With':'sari-app'}});if(!r.ok){status.textContent='Access denied. Redirecting to sign-in…';setTimeout(()=>location.replace('/'),1200);return}status.textContent='Authorized Super Admin';document.getElementById('content').hidden=false}catch(e){status.textContent='Unable to verify access. Please try again.'}})();document.getElementById('signout').onclick=()=>{sessionStorage.removeItem('sari_v2_test_token');location.replace('/')};</script></body></html>
