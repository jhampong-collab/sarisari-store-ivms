<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sari-Sari v2 Test — Accounts</title><style>body{background:#0c1512;color:#eef8f1;font:16px system-ui;margin:0;padding:28px}main{max-width:460px;margin:4vh auto;background:#14241d;padding:26px;border-radius:18px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0 15px;border-radius:8px;border:1px solid #4c695a}input{background:#0d1b14;color:white}button{background:#1bc88a;color:#052215;font-weight:bold;cursor:pointer}button.secondary{background:transparent;color:#b4e9cf}#message{white-space:pre-wrap;line-height:1.5}small{color:#b2c8bd}</style></head><body><main><h1>Sari-Sari Store v2.0</h1><p>Private store registration — test environment</p><div id="fields"><label>Store name<input id="store" maxlength="120" autocomplete="organization"></label><label>Owner full name<input id="name" maxlength="120" autocomplete="name"></label><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" minlength="10" autocomplete="new-password"></label></div><button id="signup">Create account and email verification</button><button class="secondary" id="signin">Already verified? Sign in</button><button class="secondary" id="activate">Activate my verified store</button><button class="secondary" id="signout">Sign out</button><p id="message" role="status"></p><small>Registration test only. Inventory, sales, credit, and staff management are disabled until tenant-safe APIs are completed.</small></main><script src="/static/onboarding.js?v=2.0.0-test.1"></script></body></html>
